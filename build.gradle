// Top-level build file where you can add configuration options common to all sub-projects/modules.  
buildscript {
    repositories {
        // Use the modern, required repositories. jcenter is shut down.
        google()
        mavenCentral()
    }
    dependencies {
        // Upgrade the Android Gradle Plugin to a version compatible with modern libraries and SDK 34.
        classpath 'com.android.tools.build:gradle:8.1.4'

        // REMOVED: classpath 'com.google.gms:google-services:4.4.1'
        // Removed because HFM uses Dynamic Runtime Initialization (FirebaseManager) 
        // instead of the static build-time plugin binding.
    }
}

allprojects {
    repositories {
        // Ensure all parts of the project use the modern repositories.
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}